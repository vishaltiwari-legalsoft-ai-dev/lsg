# config/crawl.yml — P1 site-mapper and P2 fetcher: page-kind classification,
# path probes, per-firm caps, and the rate-discipline defaults the per-host
# token bucket falls back to when a host declares no Crawl-delay.
#
# max_concurrent_hosts bounds how many DIFFERENT hosts P1/P2/P4/JA1 fetch
# concurrently in one run (a semaphore over per-host worker tasks) — it does
# NOT relax the per-host interval below, which is what keeps any single site
# to <=1 request per interval no matter how many hosts run at once.

rate:
  default_interval_s: 2.0
  max_concurrent_hosts: 12

# page_kind -> regexes matched case-insensitively against the URL path only
# (never the query string or fragment). Checked in this order; the first
# kind whose pattern matches wins. A path matching none of these is 'other'.
#
# D-030 added locations, testimonials and news: where a firm says where it
# sits, what clients say about it, and what it has been up to lately.
page_kinds:
  home:
    - '^/$'
  careers:
    # career-opportunities/, Careers.asp — real careers pages found in the probe
    - '/careers?(?:[-_./]|$)'
    # /law-careers, /legal-careers — the word as the last segment's suffix only, so a
    # blog post about a "career academy" mid-slug is not a careers page
    - '[-_]careers?/?$'
    - '/jobs(?:/|$)'
    # /hiring-personal-injury-paralegal-atlanta-ga — a posting linked from the
    # homepage. Not /hiring-a-lawyer or /hiring-an-attorney blog posts.
    - '/(?:now-|we-are-|were-)?hiring(?!-an?-)(?:[-_/]|$)'
    # NOT bare /employment: on an employment-law firm that is a practice page
    # ("Employment Law — wrongful termination…"); the live probe mis-read it as careers.
    - '/employment-opportunit'
    - '/join-(?:our-team|us)'
    - '/work-with-us'
  locations:
    - '/locations?(?:/|$)'
    - '/offices?(?:/|$)'
    - '/office-locations?'
    - '/our-offices'
    - '/areas-we-serve'
    - '/service-areas?'
  testimonials:
    - '/testimonials?(?:/|$)'
    - '/reviews?(?:/|$)'
    - '/client-(?:reviews|testimonials|stories)'
    - '/what-(?:our-)?clients-say'
    - '/success-stories'
    - '/case-results?'
    - '/results(?:/|$)'
    - '/verdicts'
    - '/settlements'
  news:
    - '/blog(?:/|$)'
    - '/news(?:/|$)'
    - '/articles?(?:/|$)'
    - '/press(?:/|$)'
    - '/media(?:/|$)'
    - '/firm-news'
    - '/in-the-news'
    - '/updates(?:/|$)'
    - '/insights(?:/|$)'
  attorneys:
    - '/attorneys?(?:/|$)'
    - '/our-attorneys'
    - '/lawyers?(?:/|$)'
  team:
    - '/our-team'
    - '/(?:the-)?team(?:/|$)'
    - '/staff(?:/|$)'
  practice:
    - '/practice-areas?'
    - '/practice(?:/|$)'
    - '/services(?:/|$)'
    - '/what-we-do'
  about:
    - '/about-us'
    - '/about(?:/|$)'
  contact:
    - '/contact-us'
    - '/contact(?:/|$)'
  fees:
    - '/fees(?:/|$)'
    - '/pricing'

# P1's own path probes: candidate URLs added as site_map rows
# (discovered_via='probe') for any page_kind with zero sitemap-discovered
# URLs. P2 fetches these exactly like any other site_map URL — a probe that
# 404s is simply recorded that way, not treated as an error.
probe_paths:
  about:        ['/about', '/about-us']
  attorneys:    ['/attorneys', '/our-attorneys']
  team:         ['/our-team', '/team']
  practice:     ['/practice-areas']
  contact:      ['/contact', '/contact-us']
  careers:      ['/careers', '/jobs', '/employment-opportunities']
  fees:         ['/fees']
  locations:    ['/locations', '/offices']
  testimonials: ['/testimonials', '/reviews']
  news:         ['/blog', '/news']

# Per-firm caps on the pages read: applied by P1 to the initial map (home
# first, then practice, then every other kind) and by P2 to the links it
# discovers on fetched pages, until `total` is reached. A kind without its
# own line gets `other`.
caps:
  home: 1
  practice: 6
  careers: 3
  contact: 2
  about: 2
  attorneys: 3
  team: 3
  locations: 2
  testimonials: 3
  news: 4
  fees: 1
  other: 2
  total: 30

sitemap:
  max_urls_read: 2000
