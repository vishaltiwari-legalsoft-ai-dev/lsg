# P6 fee-model detector patterns, precedence order: contingency, fee_shifting, flat,
# hourly. The spec's patterns come first, verbatim, from context/10-icp/03-fee-model.md
# ("Detection — P6 regex, precedence-ordered, first match wins"); probe-measured
# extensions follow them (decision D-020). Within one sentence, the first family in
# this order whose pattern matches wins that sentence.
#
# See lge/classify/fee.py for how site-level ambiguity across families is resolved
# (page real estate, tie -> mixed). Never guess this field — see the source doc's
# "Why `unknown` must be reachable" section.

contingency:
  # --- the spec's three, verbatim ---
  - '\bno\s+(?:fee|win|recovery)\b.{0,24}\b(?:unless|until|if)\b'
  - '\bcontingen(?:cy|t)[\s-]?fee\b'
  - '\byou\s+(?:pay|owe)\s+nothing\s+unless\b'
  # --- probe-measured extensions (live probe, 11 Sep 2026) ---
  # 29 of 150 "unknown" PI firms stated contingency in phrasings the three above miss.
  # Each line names a real example. Apostrophe class includes U+FFFD because some
  # pages still decode "won't" as "won�t" upstream.
  # "No Fees Unless We Win", "no legal fees, unless and until", "no payment ... unless"
  - '\bno\s+(?:legal\s+)?(?:fees|payment|charge)\b.{0,40}\b(?:unless|until)\b'
  # "on a contingency basis", "our contingency policy", "work on contingency"
  - '\bcontingen(?:cy|t)\s+(?:basis|policy|arrangement|agreement)\b'
  - '\b(?:work|works|working|handle[sd]?|take[sn]?|accept(?:s|ed)?|provide|services)\b.{0,40}\bon\s+(?:a\s+)?contingency\b'
  # "You won't pay anything unless you win", "you will not owe us anything unless",
  # "you don't owe us a thing unless we win"
  - '\byou\s+(?:(?:do\s+not|don[''’�]t|won[''’�]t|will\s+not|never)\s+(?:pay|owe))\b.{0,40}\b(?:unless|until)\b'
  # "We don't get paid unless you are paid", "we only get paid if we win"
  - '\bwe\s+(?:do\s+not|don[''’�]t|only)\s+get\s+paid\b.{0,40}\b(?:unless|until|if|when)\b'
  # --- site-chrome slogans (live probe, 14 Sep 2026; D-026) ---
  # Header/footer/title slogans: "No Recovery, No Fee", "No Win No Fee",
  # "No Fee Without Recovery". No "unless" in them, so the spec's first pattern misses.
  - '\bno\s+(?:recovery|win)\b[\s,.:;!|-]{0,6}\bno\s+fees?\b'
  - '\bno\s+fees?\b[\s,.:;!|-]{0,6}\b(?:no|without)\s+(?:recovery|win)\b'
  # "Contingency-Based Legal Representation" (warlawgroup.com footer)
  - '\bcontingen(?:cy|t)[\s-]based\b'
  # "Doesn't collect a fee unless you win compensation" (fltlaw.com)
  - '\b(?:doesn[''’�]t|does\s+not|don[''’�]t|won[''’�]t|never)\s+(?:collect|charge|take|receive|get|earn)\b.{0,24}\bfees?\b.{0,24}\b(?:unless|until)\b'

fee_shifting:
  - '\bfees?\b.{0,20}\bpaid\s+by\s+(?:the\s+)?(?:defendant|employer|manufacturer)\b'
  - '\bfee[\s-]shifting\b'
  - '\b(?:they|the\s+other\s+side)\s+pay(?:s)?\s+(?:my|our|your)\s+fees\b'

flat:
  - '\bflat[\s-](?:fee|rate)\b'
  - '\$[\d,]+\s+(?:flat|total|all[\s-]inclusive)\b'

hourly:
  - '\bhourly\s+rate\b'
  - '\bbilled\s+(?:hourly|by\s+the\s+hour)\b'
  # The spec's bare "per hour" matched SPEED on accident-law pages -- "must slow to
  # 10 miles per hour", "e-bikes travel up to 28 miles per hour" -- and put two
  # personal-injury firms on the hourly tier (D-026). Billing needs money or a
  # billing word next to it.
  - '\$\s?\d[\d,]*(?:\.\d+)?\s*(?:per|an|a|/)\s*hour\b'
  - '\b(?:bill(?:ed|s|ing)?|charg(?:e|es|ed|ing)|rates?|fees?)\b[^.\n]{0,40}\bper\s+hour\b'
