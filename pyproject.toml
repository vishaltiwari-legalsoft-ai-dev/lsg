[project]
name = "lge"
version = "0.1.0"
description = "Legal Soft lead generation engine — acquisition, qualification, pain detection, outreach drafts"
requires-python = ">=3.12"
dependencies = [
  "psycopg[pool]>=3.2",   # pure-python mode; libpq.dll comes from .local/pgsql/bin
  "httpx>=0.27",
  "lxml>=5.3",            # selectolax is blocked by Windows Application Control here
  "trafilatura>=1.12",
  "extruct>=0.17",
  "protego>=0.3",
  "tldextract>=5.1",
  "phonenumbers>=8.13",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "typer>=0.12",
  "anthropic>=0.40",
  "fastapi>=0.141.1",
  "uvicorn>=0.52.4",
]

[project.optional-dependencies]
render = ["playwright>=1.47"]

[project.scripts]
lge = "lge.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p lge._bootstrap"
asyncio_mode = "auto"
markers = [
  "db: needs a running Postgres (LGE_DSN)",
  "live: touches the public internet — skipped unless LGE_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
